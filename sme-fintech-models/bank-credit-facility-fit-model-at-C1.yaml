# Financial margin of safety — input model. A business bank's credit facility line (Case B), Path C mode 3, at C1.
# Mode 3: the price ceiling is the price the incumbent's borrowers pay today (RD-024 (e)); the margin check does not gate.
# Every ⚠ figure is Tier 4 until the insider corrects it. The bank is not named. No internal figure is used.
venture: Business bank credit facility line (Case B)
state: at-C1
date: 2026-09-18

bounding:
  currency: GBP
  unit: 1000 of average drawn balance
  period: year
  scale_state: at-scale

derived_from:
  operating_model: bank-credit-facility-aom-v1-2026-09-18.md
  customer_model: bank-credit-facility-ctm-v1-2026-09-18.md

gate: per_requirement

cost_floor:
  layers:
    pvc:
      band: {low: 40.0, high: 83.0}
      tier: T4
      unit: GBP per 1000 of average drawn balance
      period: year
      scale_state: at-scale
      basis: activity
      source: AOM 3a — funding from the account line's deposits ⚠ 1.5–3.0% (Bank Rate 4.0% from August 2025, FACT; business deposits pay ⚠ 1–3%) = 15–30; expected loss on a flow-underwritten pool ⚠ 2.0–4.0% = 20–40 (FinRegLab 2019 and 2025 show cash-flow variables predict default independently of the owner's score; the level is ⚠); ledger and limit-engine compute per drawn account ⚠ 2–5; exception handling and write-off administration ⚠ 3–8
    rc:
      band: {low: 2.0, high: 5.0}
      tier: T4
      unit: GBP per 1000 of average drawn balance
      period: year
      scale_state: at-scale
      basis: activity
      source: AOM 3c — limit engine and data team ⚠ 25 people 3–4m, model risk and credit oversight ⚠ 10 people 1.5–2m, product, conduct and CCA compliance ⚠ 10 people 1–1.5m, exception cells ⚠ 21 people 1.5–2m, technology run cost ⚠ 1–3m, fraud allocation ⚠ 0.5–2m = ⚠ 8–15m a year, divided by a drawn book of ⚠ 3.4–5.7bn (own base ⚠ 950,000 accounts, PCO S11; ⚠ 80% carry a limit; ⚠ 30% drawn; ⚠ 15–25k average drawn)
    sc:
      not_designed_until: C3
    ic:
      band: {low: 12.0, high: 17.0}
      tier: T4
      unit: GBP per 1000 of average drawn balance
      period: year
      scale_state: at-scale
      basis: activity
      source: AOM 6 — regulatory capital on the drawn balance, standardised approach, regulatory retail SME risk weight 75% (FACT, CRR Art. 123) x ⚠ 12% total capital ratio x ⚠ 12–15% cost of equity = 10.8–13.5; plus capital on the undrawn limit, ⚠ 1.5–2.5 of undrawn per 1 drawn x 10% credit conversion factor for unconditionally cancellable commitments under Basel 3.1 (PRA PS9/24, from 1 January 2027) x 75% x 12% x 12–15% = 1.6–3.4; rounded to 12–17

price_ceiling:
  kmc:
    band: {low: 75.0, high: 120.0}
    tier: T4
    unit: GBP per 1000 of average drawn balance
    period: year
    scale_state: at-scale
    source: mode 3 — the all-in price the incumbent's small-business borrowers pay today. FACT — Bank of England effective rate on new SME loans 6.18–7.00% through 2025 (Money and Credit, November 2025); overdrafts and small unsecured facilities ⚠ 10–15%; arrangement and renewal fees ⚠ 1–2% a year equivalent; blended for a book that is 47% overdraft use and 37% loan use (SME Finance Monitor Q4 2024) = ⚠ 7.5–12.0%. The R2 key monetizable cost replaces this at C2 as the permitted ceiling; the recorded ceiling stays this figure
  customer_surplus_fraction:
    value: 0.95
    source: mode 3 — the ceiling is the price the borrower pays today, by existence (RD-024 (e)). The checker requires a share strictly below 1, so the fee element (⚠ 1–2% of the 7.5–12%) is discounted by a twentieth as the part most often waived. The undiscounted figure is reported by hand beside the checker's output in the verifier file. Method gap already logged in the WS1 feedback log (Tenzing R1, 16 September 2026)
